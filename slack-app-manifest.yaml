display_information:
  name: itakeit agent
  description: Claims itakeit tasks it can handle and reports progress with reactions.
  background_color: "#1e8764"
features:
  bot_user:
    display_name: itakeit-agent
    always_online: true
oauth_config:
  scopes:
    bot:
    - channels:history
    - groups:history
    - channels:read
    - groups:read
    - chat:write
    - reactions:read
    - reactions:write
settings:
  event_subscriptions:
    bot_events:
    - message.channels
    - message.groups
    - reaction_added
    - member_joined_channel
    - member_left_channel
    - channel_left
    - group_left
    - channel_archive
    - group_archive
    - channel_unarchive
    - group_unarchive
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
