# itakeit and itakeit-agent in a Kubernetes cluster, the agent's kubectl using
# its ServiceAccount (in-cluster config). See README.md. Build it with
# `kubectl kustomize examples/in-cluster`, apply with `kubectl apply -k`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: itakeit
resources:
  - namespace.yaml
  - rbac.yaml
  - agent.yaml
  - itakeit.yaml
# config.yaml is copied here from the repo root (gitignored in every
# directory). It holds no secrets: the tokens are in the Secret README.md
# creates.
configMapGenerator:
  - name: itakeit-config
    files:
      - config.yaml
