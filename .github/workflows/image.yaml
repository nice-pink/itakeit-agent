name: image

# Only what the image is built from triggers a build: Go code and its tests (the Dockerfile
# runs ./build), go.mod/go.sum, the build script, the Dockerfiles, .dockerignore and this file.
# Docs, homepage, examples, assets and license changes alone build nothing.
# Path filters do not apply to tag pushes, so a release tag always builds.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - go.mod
      - go.sum
      - build
      - 'Dockerfile*'
      - .dockerignore
      - .github/workflows/image.yaml
  pull_request:
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - go.mod
      - go.sum
      - build
      - 'Dockerfile*'
      - .dockerignore
      - .github/workflows/image.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # itakeit-agent, itakeit-agent-mem with poma-memory for agent.memory, and
    # itakeit-agent-langdock for backend langdock.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ''
          - dockerfile: Dockerfile.mem
            suffix: -mem
          - dockerfile: Dockerfile.langdock
            suffix: -langdock
    runs-on: ubuntu-latest
    # The mem image installs poma-memory and its model under QEMU for arm64 too.
    timeout-minutes: ${{ matrix.suffix == '' && 30 || 60 }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows main, v1.2.3 tags also publish 1.2.3 and 1.2, every build gets sha-<short>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The Dockerfile runs ./build, so tests gate every push. Pull requests build but never push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image${{ matrix.suffix }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=image{0}', matrix.suffix) || '' }}
