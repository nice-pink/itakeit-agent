# The agent reads itakeit's own config file, so both apps agree on the channel,
# the emoji and status_claims. Copy the itakeit config and add the agent block;
# itakeit ignores it. The fields below the agent block are itakeit's and are
# documented in itakeit's config.example.yaml.
channel: C0123456789
status_claims: false
emoji:
  claim: [raising_hand]
  investigating: [eyes]
  in_progress: [construction]
  needs_info: [question]
  blocked: [no_entry]
  done: [white_check_mark]

agent:
  # The itakeit app's App ID, so its board, cards and pings are not taken for
  # tasks or answers. Slack shows an app no member ID; the App ID is on
  # api.slack.com/apps -> itakeit -> Basic Information -> App ID.
  itakeit_app: A0123456789
  # Or the itakeit bot's member ID, which auth.test with itakeit's bot token
  # returns as user_id:
  # itakeit_user: U0123456789

  # What the agent can do. It takes only tasks this covers. Without tools (below)
  # that also means tasks a written reply completes, since it has no system access.
  skills: |
    Answer questions about Go, Kubernetes and our GitOps setup. Explain error
    messages and logs pasted into the task. Draft docs, runbooks and release notes.

  # Where the model calls go.
  # claude-code (default): the Claude Code CLI, with its login (`claude auth login`,
  #   or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`). Usage counts against
  #   that Claude plan.
  # api: the Messages API, with ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN or an
  #   `ant auth login` profile. Billed to the Console organization.
  backend: claude-code

  # The Claude Code CLI to run, for backend claude-code.
  claude_bin: claude

  # Model for triage and work. Default opus for claude-code (a CLI alias) and
  # claude-opus-5 for api.
  model: opus

  # Files the agent knows, like a CLAUDE.md you pick: runbooks, architecture
  # notes, conventions. Relative to this file's directory, read at startup, sent
  # (cached) with every triage and work request, 256 KB total at most. The
  # channel can get them quoted, so no secrets.
  knowledge: []
  # knowledge:
  #   - knowledge/infra.md
  #   - knowledge/runbooks.md

  # Seconds to wait after a task is posted before considering it, so people get
  # the first pick. 0 takes tasks immediately.
  claim_delay_seconds: 120

  # false: skip tasks someone has already claimed (or, with status_claims, holds
  # any status on). true: take them too, as an additional owner. Tasks someone
  # marked done are always skipped.
  claim_owned: false

  # Tools for work rounds (backend claude-code only, see README "Tools").
  # propose (default): investigate with read entries, propose what a human
  # should change. fix: also run write entries, each posted before it runs and,
  # with an approver, run only after that user's reaction.
  # mode: propose
  # approver: U0123456789
  # tools:
  #   read:
  #     - Read
  #     - "Bash(kubectl get *)"
  #   write:
  #     - "Bash(kubectl rollout restart *)"
  # approval_timeout_minutes: 30
  # work_timeout_minutes: 15
  # max_sessions: 2
  # mcp_servers:
  #   github:
  #     type: stdio
  #     command: github-mcp-server
  #     args: [stdio]
  #     env: [GITHUB_PERSONAL_ACCESS_TOKEN]

  # Searchable memory of past tasks, with poma-memory (README "Memory"). Needs
  # the itakeit-agent-mem image (Dockerfile.mem). Learnings from done tasks are
  # saved after the approver's reaction, unless approval is false.
  # memory:
  #   enabled: true
  #   dir: memory
  #   bin: poma-memory
  #   results: 3
  #   approval: true

  # Extra environment variables for the claude CLI. It gets only what it needs
  # (PATH, HOME, proxies, CLAUDE_CODE_*, ...), never the Slack tokens. List
  # anything else it should see here.
  env: []

  # Model calls (triage and work) running at the same time.
  max_parallel: 2

  # On start, owned tasks are rebuilt from the agent's reactions on this many of
  # the latest channel messages. Interrupted tasks are worked on again.
  recover_messages: 200
